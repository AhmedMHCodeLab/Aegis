- id: SEC-001
  name: Secrets externalized
  category: Secret Manager
  severity: HIGH
  description: Application secrets must be stored in Secret Manager, not in environment variables or code.
  field: secrets.storage
  operator: equals
  expected: secret_manager
  remediation: >-
    Move all application secrets to Secret Manager. Mount them as
    volumes or access them via the Secret Manager API at runtime.
    Never embed secrets in environment variables, container images,
    or source code.

- id: SEC-002
  name: Workload Identity access scoped
  category: Secret Manager
  severity: MEDIUM
  description: Secret access must use Workload Identity with scoped permissions, not static keys.
  field: secrets.access_method
  operator: equals
  expected: workload_identity
  remediation: >-
    Configure the Cloud Run service account with secretAccessor role
    scoped to specific secrets. Access secrets via Workload Identity,
    not static API keys or exported credentials.

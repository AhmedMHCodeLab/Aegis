- id: NET-001
  name: VPC egress path configured
  category: Network
  severity: HIGH
  description: Cloud Run egress must traverse a customer-controlled VPC where firewall rules and Private Google Access apply.
  # Two mechanisms reach the same outcome: a Serverless VPC Access connector or
  # direct VPC egress. The engine has no disjunction, so the choice is expressed
  # in a handler rather than by naming one mechanism and failing the other.
  evaluator: custom
  handler: src.rules.custom.net_001
  remediation: >-
    Route Cloud Run egress into your VPC using either direct VPC egress
    (a network interface on your subnet) or a Serverless VPC Access
    connector, so firewall rules and Private Google Access apply to it.

- id: NET-002
  name: Restricted egress
  category: Network
  severity: MEDIUM
  description: Egress must be restricted to VPC Connector routes, not all traffic.
  # not_equals passes on an absent field, so presence is asserted first: an
  # undeclared egress setting is missing evidence, not a restricted egress.
  assertions:
    - field: network.egress_setting
      operator: exists
    - field: network.egress_setting
      operator: not_equals
      expected: all-traffic
  remediation: >-
    Set egress to 'private-ranges-only' or use VPC firewall rules to
    enforce default-deny egress with explicit allowlists. 'all-traffic'
    routes everything through the connector but does not restrict
    destinations.

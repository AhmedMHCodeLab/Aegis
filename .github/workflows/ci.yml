name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE: me-central1-docker.pkg.dev/aegis-prod-0926/aegis/aegis
  PROJECT_ID: aegis-prod-0926
  SERVICE: aegis
  REGION: me-central1
  KEY_RING: aegis
  ATTESTOR: aegis-built-by-ci
  WIF_PROVIDER: projects/345093621666/locations/global/workloadIdentityPools/github-actions/providers/aegis-repo
  CI_SA: aegis-ci@aegis-prod-0926.iam.gserviceaccount.com

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - run: pip install -r app/requirements.txt pytest httpx
      - run: PYTHONPATH=app pytest tests/ -v

  sast:
    name: SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r app/src/ --severity-level high --confidence-level high

  sca:
    name: SCA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        with:
          inputs: app/requirements.txt

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  iac-scan:
    name: IaC Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - run: pip install checkov
      - run: checkov -d terraform/ --framework terraform --quiet --compact --config-file terraform/.checkov.yaml

  # --- PR: build and scan only (no push) ---
  build-scan:
    name: Build & Scan
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan, iac-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t aegis:${{ github.sha }} -f app/Dockerfile .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: aegis:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore

  # --- Main: build once, scan, push, sign, attest, verify, deploy by digest ---
  build-sign-deploy:
    name: Build, Sign & Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [test, sast, sca, secret-scan, iac-scan]
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.CI_SA }}

      # binauthz attestations sign-and-create is beta only, and the runner's
      # gcloud cannot install components from a non-interactive prompt.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: beta

      - name: Auth Docker to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -f app/Dockerfile .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          format: table
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Push and capture digest
        id: push
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${{ env.IMAGE }}:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed: $DIGEST"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image
        run: cosign sign --yes ${{ steps.push.outputs.digest }}

      - name: Attest provenance
        run: |
          cat > /tmp/provenance.json <<EOF
          {
            "buildType": "https://github.com/${{ github.repository }}/workflows/ci",
            "builder": {
              "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            },
            "invocation": {
              "configSource": {
                "uri": "git+https://github.com/${{ github.repository }}@${{ github.ref }}",
                "digest": {"sha1": "${{ github.sha }}"},
                "entryPoint": ".github/workflows/ci.yml"
              }
            },
            "materials": [
              {
                "uri": "git+https://github.com/${{ github.repository }}",
                "digest": {"sha1": "${{ github.sha }}"}
              }
            ]
          }
          EOF
          cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance \
            ${{ steps.push.outputs.digest }}

      - name: Verify signature before deploy
        run: |
          cosign verify \
            --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
            --certificate-identity='https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main' \
            ${{ steps.push.outputs.digest }}

      # Binary Authorization cannot read the keyless signature above, since a
      # policy needs a stable public key and keyless issues an ephemeral cert.
      # This is the same claim in the form the admission controller accepts, and
      # it is what blocks an image deployed outside this pipeline.
      - name: Create Binary Authorization attestation
        run: |
          gcloud beta container binauthz attestations sign-and-create \
            --project="${{ env.PROJECT_ID }}" \
            --artifact-url="${{ steps.push.outputs.digest }}" \
            --attestor="${{ env.ATTESTOR }}" \
            --attestor-project="${{ env.PROJECT_ID }}" \
            --keyversion-project="${{ env.PROJECT_ID }}" \
            --keyversion-location="${{ env.REGION }}" \
            --keyversion-keyring="${{ env.KEY_RING }}" \
            --keyversion-key="aegis-attestor" \
            --keyversion="1"

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.push.outputs.digest }}
          wait: true

      - name: Verify deployment
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Deployed to: $URL"
